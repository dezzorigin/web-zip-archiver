name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build (static export + worker)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload static output
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/

  worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Worker unit tests
        run: node --test worker/_worker.test.mjs

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Audit dibatasi ke dependensi produksi (--omit=dev): satu-satunya
      # temuan high di dev adalah picomatch ReDoS (GHSA-fc5q-39xc-vjpf)
      # lewat toolchain lint (eslint-config-next) — belum ada versi
      # patched (patched: None), dan picomatch hanya jalan saat lint di
      # file lokal tepercaya, tidak pernah dikirim ke pengguna. Temuan
      # high di produksi (PostCSS di bawah next) sudah ditutup lewat
      # overrides postcss 8.5.33 di package.json.
      - name: Dependency audit (production, high and above)
        run: npm audit --omit=dev --audit-level=high

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download static output
        uses: actions/download-artifact@v4
        with:
          name: out
          path: out

      - name: Lighthouse audit
        run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json

  # Live smoke test terhadap situs produksi (https://web-zip-archiver.pages.dev).
  # Berjalan di runner GitHub (jaringan normal) — BUKAN di VM Muse, karena
  # proxy egress VM tidak bisa menyelesaikan POST ke project Pages yang
  # memakai _worker.js. Job ini non-gating (continue-on-error): ia
  # menguji layanan upstream saveweb2zip.com juga, jadi merahnya bisa
  # berarti upstream sedang down, bukan kode repo yang rusak.
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - name: Start clone (example.com)
        id: start
        run: |
          set -e
          resp=$(curl -s -w "\n%{http_code}" -X POST "https://web-zip-archiver.pages.dev/api/clone/start" \
            -H "content-type: application/json" \
            -d '{"url": "https://example.com", "renameAssets": true, "saveStructure": true, "alternativeAlgorithm": false, "mobileVersion": false}')
          code=$(echo "$resp" | tail -1)
          body=$(echo "$resp" | head -n -1)
          echo "start HTTP $code: $body"
          test "$code" = "200"
          md5=$(echo "$body" | python3 -c "import json,sys; print(json.load(sys.stdin)['md5'])")
          test -n "$md5"
          echo "md5=$md5" >> "$GITHUB_OUTPUT"

      - name: Poll status until finished
        run: |
          set -e
          for i in $(seq 1 60); do
            body=$(curl -s "https://web-zip-archiver.pages.dev/api/clone/status?md5=${{ steps.start.outputs.md5 }}")
            echo "poll $i: $body"
            finished=$(echo "$body" | python3 -c "import json,sys; print(json.load(sys.stdin).get('isFinished'))")
            if [ "$finished" = "True" ]; then
              echo "$body" > /tmp/status.json
              break
            fi
            sleep 3
          done
          python3 - <<'PYEOF'
          import json
          d = json.load(open('/tmp/status.json'))
          assert d.get('isFinished') is True, d
          assert d.get('success') is True, d
          assert d.get('copiedFilesAmount', 0) > 0, d
          print(f"OK finished: {d.get('copiedFilesAmount')} files, md5={d.get('md5')}")
          PYEOF

      - name: Verify download is a real ZIP
        run: |
          set -e
          curl -s -D /tmp/dl.headers -o /tmp/archive.zip \
            "https://copier.saveweb2zip.com/api/downloadArchive/${{ steps.start.outputs.md5 }}"
          head -c 200 /tmp/dl.headers
          python3 - <<'PYEOF'
          import os
          with open('/tmp/archive.zip','rb') as f:
              magic = f.read(4)
          print('magic:', magic)
          assert magic[:2] == b'PK', magic
          print('zip bytes:', os.path.getsize('/tmp/archive.zip'))
          PYEOF
